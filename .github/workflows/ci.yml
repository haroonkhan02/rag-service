name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Tests use a tiny synthetic corpus and a hashing embedder:
      # no PyTorch, no model download, no corpus and no API key needed.
      # `eval` adds llm-eval-harness, whose regression gate the answer report uses.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # Build the image (corpus download, index build and both models happen inside the
  # build), then start a container without network access and call the API.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rag-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker_smoke.sh rag-service:ci

  # The answer-quality gate on the committed score files (llm-eval-harness).
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install llm-eval-harness
        run: pip install "llm-eval-harness @ git+https://github.com/haroonkhan02/llm-eval-harness"
      - name: Reranked retrieval must not answer worse than BM25 alone
        run: llmeval-gate evals/answers_bm25.csv evals/answers_hybrid_rerank.csv
